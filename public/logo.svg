<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8B23A"/>
      <stop offset="1" stop-color="#F5CD6B"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12" fill="#0C1015" stroke="#E8B23A" stroke-opacity="0.85" stroke-width="1"/>
  <!-- three ascending candle bodies -->
  <g>
    <line x1="17" y1="34" x2="17" y2="48" stroke="#E8B23A" stroke-width="1.6" stroke-opacity="0.7"/>
    <rect x="13" y="36" width="8" height="10" rx="1.5" fill="url(#goldBar)" fill-opacity="0.85"/>
    <line x1="29" y1="26" x2="29" y2="44" stroke="#E8B23A" stroke-width="1.6" stroke-opacity="0.7"/>
    <rect x="25" y="28" width="8" height="13" rx="1.5" fill="url(#goldBar)"/>
    <line x1="41" y1="16" x2="41" y2="38" stroke="#E8B23A" stroke-width="1.6" stroke-opacity="0.7"/>
    <rect x="37" y="19" width="8" height="15" rx="1.5" fill="url(#goldBar)"/>
  </g>
  <!-- dashed forecast-cone arc sweeping up-right from the last bar -->
  <path d="M 41 19 Q 50 14 55 8" fill="none" stroke="#F5CD6B" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 41 24 Q 51 22 57 18" fill="none" stroke="#E8B23A" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
</svg>
